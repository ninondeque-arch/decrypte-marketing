<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connexion TikTok</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #111; background: #fff; }
  code { display: block; padding: 1rem; background: #f3f3f3; word-break: break-all; border-radius: 8px; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Connexion TikTok reçue</h1>
<p>Retour au studio en cours… Si rien ne se passe, ouvre le studio (http://localhost:4321) et recommence, ou copie cette adresse dans le terminal qui l'attend.</p>
<code id="url"></code>
<button id="copy" type="button">Copier</button>
<script>
  // Renvoie la réponse de TikTok vers le studio local (sur l'ordinateur de l'utilisatrice).
  // Si le studio n'est pas ouvert, l'adresse reste affichée pour la recopier dans le terminal.
  document.getElementById('url').textContent = location.href;
  if (location.search.includes('code=') || location.search.includes('error=')) {
    location.replace('http://localhost:4321/tiktok/callback' + location.search);
  }
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(location.href);
</script>
</body>
</html>
